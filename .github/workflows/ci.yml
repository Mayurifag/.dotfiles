name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check encrypted files
        uses: Mayurifag/encrypted-files-guard-action@master
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install npm tools
        run: npm install -g markdownlint-cli2 @prantlf/jsonlint
      - name: Check ShellCheck version
        run: shellcheck --version
      - name: Install Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.4"
          checksum: "3ab2b34aeacdbc1ea5c529cdbda3e05792633d587228123fd09f3b5a0facb27a"
          args: "--version"
      - name: Run CI checks
        run: make ci
